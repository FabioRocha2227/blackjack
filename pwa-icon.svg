<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f7149"/>
      <stop offset="100%" stop-color="#063d25"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#3d9563" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0b4d2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b1"/>
      <stop offset="45%" stop-color="#f4d98b"/>
      <stop offset="100%" stop-color="#d7b75f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Rounded app background -->
  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#glow)"/>

  <!-- Gold ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="url(#gold)" stroke-width="18" filter="url(#shadow)"/>

  <!-- Symmetrical spade -->
  <g fill="url(#gold)" stroke="#ead18a" stroke-width="2" stroke-linejoin="round" filter="url(#shadow)">
    <path d="
      M512 235
      C474 288 390 353 350 405
      C310 456 297 511 315 559
      C333 607 374 632 420 631
      C465 630 498 606 512 567
      C526 606 559 630 604 631
      C650 632 691 607 709 559
      C727 511 714 456 674 405
      C634 353 550 288 512 235
      Z"/>
    <path d="
      M496 556
      C496 616 489 669 456 690
      C445 697 427 700 409 700
      L409 736
      L615 736
      L615 700
      C597 700 579 697 568 690
      C535 669 528 616 528 556
      Z"/>
  </g>

  <!-- Subtle base highlight -->
  <path d="M414 704 H610 V728 H414 Z" fill="#fff0b1" opacity=".35"/>
</svg>